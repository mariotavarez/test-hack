services:
  web:
    build: .
    ports:
      - "3000:80"
    depends_on:
      - api

  api:
    build: ./server
    ports:
      - "4000:3000"
    env_file:
      - .env.example
    depends_on:
      - db

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"

